{% extends "base.html" %}

{% block title %}Cadastrar Animal - Vet App{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/register_animal.css') }}">
<div class="form-container">
    <h1>Cadastrar Novo Animal</h1>
    <form method="post">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" required>
        </div>
        <div class="mb-3">
            <label for="especie" class="form-label">Espécie:</label>
            <input type="text" class="form-control" id="especie" name="especie" required>
        </div>
        <div class="mb-3">
            <label for="idade" class="form-label">Idade:</label>
            <input type="number" class="form-control" id="idade" name="idade" required>
        </div>
        <div class="mb-3">
            <label for="contato" class="form-label">Contato:</label>
            <input type="text" class="form-control" id="contato" name="contato" required>
        </div>
        
        <div class="mb-3">
            <p class="form-label">Selecione o serviço:</p>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="castracao" name="procedimento" value="castração" required>
                <label class="form-check-label" for="castracao">Castração</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="consulta" name="procedimento" value="consulta">
                <label class="form-check-label" for="consulta">Consulta</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="vacinacao" name="procedimento" value="vacinação">
                <label class="form-check-label" for="vacinacao">Vacinação</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" id="outros" name="procedimento" value="outros">
                <label class="form-check-label" for="outros">Outros:</label>
                <input type="text" class="form-control mt-1" name="procedimento_outro" placeholder="Especifique">
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
    <a href="{{ url_for('main.dashboard') }}" class="cancel-link">Voltar ao Painel</a>
</div>
{% endblock %}
