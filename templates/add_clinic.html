{% extends "base.html" %}

{% block title %}Adicionar Clínica - Vet App{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_clinic.css') }}">
<div class="form-container">
    <h1>Adicionar Nova Clínica</h1>
    <form method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Nome da Clínica:</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Senha:</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3">
            <label for="contact" class="form-label">Contato:</label>
            <input type="text" class="form-control" id="contact" name="contact" required>
        </div>
        <button type="submit" class="btn btn-primary">Adicionar Clínica</button>
    </form>
    <a href="{{ url_for('main.admin_clinics') }}" class="cancel-link">Cancelar</a>
</div>
{% endblock %}
